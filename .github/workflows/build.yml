name: Build SSMD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag to receive verified assets
        required: false
      publish:
        description: Publish the draft after checks pass
        type: boolean
        default: false
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Linux Qt platform dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1
      - name: macOS FFmpeg for integration verification
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install build dependencies
        run: python -m pip install -r source/requirements-build.txt
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s source -p 'test_*.py' -v
      - name: Provision nightly, Deno and release dependencies
        env:
          SSMD_GITHUB_TOKEN: ${{ github.token }}
        run: python source/prepare_release.py
      - name: Build native GUI
        run: python source/build.py
      - name: Nightly metadata, conversion and synthetic cookie integration
        run: python source/verify_update_native.py
      - name: Frozen Windows GUI startup
        if: runner.os == 'Windows'
        run: python source/ci_smoke.py
      - name: Frozen Linux GUI startup
        if: runner.os == 'Linux'
        run: xvfb-run -a python source/ci_smoke.py
      - name: Package native build
        run: python source/package_native.py
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:/Program Files (x86)/NSIS/makensis.exe')) { choco install nsis --no-progress -y }
      - name: Build Windows setup and smaller app update
        if: runner.os == 'Windows'
        run: python source/build_installer.py
      - name: Verify Windows installation and upgrade
        if: runner.os == 'Windows'
        run: python source/verify_installer.py
      - uses: actions/upload-artifact@v7
        with:
          name: SSMD-${{ runner.os }}-${{ runner.arch }}
          path: native-artifacts/
          if-no-files-found: error
  publish:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Attach archives and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
