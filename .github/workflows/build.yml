name: Build SSYTDLP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r source/requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -s source -p 'test_*.py' -v
      - name: Provision nightly, Deno and release dependencies
        env:
          SSYTDLP_GITHUB_TOKEN: ${{ github.token }}
        run: python source/prepare_release.py
      - name: Build native GUI
        run: python source/build.py
      - name: Frozen Windows GUI startup
        if: runner.os == 'Windows'
        run: python source/ci_smoke.py
      - name: Frozen Linux GUI startup
        if: runner.os == 'Linux'
        run: xvfb-run -a python source/ci_smoke.py
      - name: Package native build
        run: python source/package_native.py
      - uses: actions/upload-artifact@v7
        with:
          name: SSYTDLP-${{ runner.os }}-${{ runner.arch }}
          path: native-artifacts/
          if-no-files-found: error
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Attach archives and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*
